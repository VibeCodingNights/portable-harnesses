# litellm_config.yaml — model registry for the shared proxy.
#
# The proxy maps short names (`claude`, `qwen`, `glm`, `kimi`) to each lab's
# native API. Attendees never set per-lab keys — they hit the proxy with a
# per-attendee token and the proxy fans out.
#
# This file is the source of truth. To run your own proxy locally, point
# litellm at this file: `litellm --config harness/litellm_config.yaml`.

model_list:
  - model_name: claude
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: qwen
    litellm_params:
      # Alibaba DashScope, Qwen 3.6 — OpenAI-compatible endpoint
      model: openai/qwen3.6-max
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: glm
    litellm_params:
      # Zhipu BigModel / z.ai, GLM-5.1
      model: openai/glm-5.1
      api_base: https://open.bigmodel.cn/api/paas/v4/
      api_key: os.environ/ZHIPUAI_API_KEY

  - model_name: kimi
    litellm_params:
      # Moonshot, Kimi K2.6
      model: openai/kimi-k2-6
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY

litellm_settings:
  drop_params: false
  request_timeout: 60
  num_retries: 0  # we want failures to surface, not be silently retried

general_settings:
  master_key: os.environ/PROXY_MASTER_KEY
  database_url: os.environ/DATABASE_URL  # for per-attendee token tracking
